[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/netlify"

[[redirects]]
  from = "/real-estate-platform"
  to = "/real-estate-platform/"
  status = 301

[[redirects]]
  from = "/real-estate-platform/api/*"
  to = "https://real-estate-platform-production-17ac.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/real-estate-platform/*"
  to = "/real-estate-platform/index.html"
  status = 200
